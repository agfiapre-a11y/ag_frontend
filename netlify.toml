[build]
  command = """
    git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /opt/flutter &&
    export PATH="/opt/flutter/bin:$PATH" &&
    flutter --version &&
    flutter pub get &&
    flutter build web --dart-define=API_BASE_URL=${API_BASE_URL} --dart-define=SUPABASE_URL=${SUPABASE_URL} --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY} --base-href "/"
  """
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
